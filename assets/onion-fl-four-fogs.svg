<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Onion-FL four-fog topology</title>
  <desc id="desc">A cloud coordinator connects to four fog aggregators. Each fog aggregator coordinates a group of edge clients over MQTT links.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#6f997b" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#71997b"/>
    </marker>
    <marker id="arrow-warm" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#d28a6e"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="16" fill="#edf3e9"/>
  <rect width="1200" height="620" rx="16" fill="url(#grid)"/>
  <text x="54" y="48" fill="#728078" font-family="monospace" font-size="17" letter-spacing="2">ONION-FL · FOUR-FOG TOPOLOGY</text>

  <!-- Fog aggregators report upward to the cloud coordinator. -->
  <g fill="none" stroke="#71997b" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M150 319C150 197 430 194 470 150"/>
    <path d="M450 319C450 238 535 205 555 150"/>
    <path d="M750 319C750 238 665 205 645 150"/>
    <path d="M1050 319C1050 197 770 194 730 150"/>
  </g>
  <g fill="#5c7662" font-family="monospace" font-size="14" text-anchor="middle">
    <text x="270" y="219">mqtt / json / wifi</text>
    <text x="470" y="235">mqtt / json / wifi</text>
    <text x="730" y="235">mqtt / json / wifi</text>
    <text x="930" y="219">mqtt / json / wifi</text>
  </g>

  <!-- One coordinator at the cloud layer. -->
  <g>
    <rect x="420" y="72" width="360" height="80" rx="12" fill="#fffaf3" stroke="#d28a6e" stroke-width="2"/>
    <circle cx="455" cy="112" r="10" fill="#d28a6e"/>
    <text x="485" y="108" fill="#263d34" font-family="Arial,sans-serif" font-size="23" font-weight="700">CLOUD</text>
    <text x="485" y="132" fill="#728078" font-family="monospace" font-size="15">global · coordinator</text>
    <text x="744" y="119" fill="#b36c52" font-family="monospace" font-size="15" text-anchor="end">01</text>
  </g>

  <!-- Fog aggregators. -->
  <g font-family="Arial,sans-serif">
    <g><rect x="60" y="319" width="180" height="68" rx="9" fill="#fffefa" stroke="#8eb397" stroke-width="2"/><circle cx="84" cy="353" r="7" fill="#5d9870"/><text x="103" y="350" fill="#294239" font-size="19" font-weight="700">FOG A1</text><text x="103" y="372" fill="#758279" font-family="monospace" font-size="13">fog · aggregator</text></g>
    <g><rect x="360" y="319" width="180" height="68" rx="9" fill="#fffefa" stroke="#8eb397" stroke-width="2"/><circle cx="384" cy="353" r="7" fill="#5d9870"/><text x="403" y="350" fill="#294239" font-size="19" font-weight="700">FOG A2</text><text x="403" y="372" fill="#758279" font-family="monospace" font-size="13">fog · aggregator</text></g>
    <g><rect x="660" y="319" width="180" height="68" rx="9" fill="#fffefa" stroke="#8eb397" stroke-width="2"/><circle cx="684" cy="353" r="7" fill="#5d9870"/><text x="703" y="350" fill="#294239" font-size="19" font-weight="700">FOG B1</text><text x="703" y="372" fill="#758279" font-family="monospace" font-size="13">fog · aggregator</text></g>
    <g><rect x="960" y="319" width="180" height="68" rx="9" fill="#fffefa" stroke="#8eb397" stroke-width="2"/><circle cx="984" cy="353" r="7" fill="#5d9870"/><text x="1003" y="350" fill="#294239" font-size="19" font-weight="700">FOG B2</text><text x="1003" y="372" fill="#758279" font-family="monospace" font-size="13">fog · aggregator</text></g>
  </g>

  <!-- Edge client groups connect to their fog aggregator. -->
  <g fill="none" stroke="#d28a6e" stroke-width="2.5" marker-end="url(#arrow-warm)">
    <path d="M150 498V400"/><path d="M450 498V400"/><path d="M750 498V400"/><path d="M1050 498V400"/>
  </g>
  <g fill="#a96651" font-family="monospace" font-size="13" text-anchor="middle">
    <text x="150" y="423">mqtt / json / 4g</text><text x="450" y="423">mqtt / json / 4g</text><text x="750" y="423">mqtt / json / 4g</text><text x="1050" y="423">mqtt / json / 4g</text>
  </g>
  <g font-family="monospace" font-size="13" text-anchor="middle" fill="#526b5a">
    <g><rect x="60" y="498" width="180" height="62" rx="9" fill="#e2ede0" stroke="#b5cdb6"/><circle cx="96" cy="529" r="7" fill="#7ca887"/><circle cx="120" cy="529" r="7" fill="#7ca887"/><circle cx="144" cy="529" r="7" fill="#7ca887"/><text x="192" y="534" text-anchor="middle">EDGE CLIENTS</text></g>
    <g><rect x="360" y="498" width="180" height="62" rx="9" fill="#e2ede0" stroke="#b5cdb6"/><circle cx="396" cy="529" r="7" fill="#7ca887"/><circle cx="420" cy="529" r="7" fill="#7ca887"/><circle cx="444" cy="529" r="7" fill="#7ca887"/><text x="492" y="534" text-anchor="middle">EDGE CLIENTS</text></g>
    <g><rect x="660" y="498" width="180" height="62" rx="9" fill="#e2ede0" stroke="#b5cdb6"/><circle cx="696" cy="529" r="7" fill="#7ca887"/><circle cx="720" cy="529" r="7" fill="#7ca887"/><circle cx="744" cy="529" r="7" fill="#7ca887"/><text x="792" y="534" text-anchor="middle">EDGE CLIENTS</text></g>
    <g><rect x="960" y="498" width="180" height="62" rx="9" fill="#e2ede0" stroke="#b5cdb6"/><circle cx="996" cy="529" r="7" fill="#7ca887"/><circle cx="1020" cy="529" r="7" fill="#7ca887"/><circle cx="1044" cy="529" r="7" fill="#7ca887"/><text x="1092" y="534" text-anchor="middle">EDGE CLIENTS</text></g>
  </g>
</svg>
